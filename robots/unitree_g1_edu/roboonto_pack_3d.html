<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboOnto · Unitree Robotics G1 EDU (23-DOF) Ontology Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0a0d14;
  --bg-1: #0f1420;
  --bg-2: #161c2e;
  --fg-0: #e8eaf0;
  --fg-1: #aab3c5;
  --fg-2: #6b7590;
  --border: rgba(232, 234, 240, 0.08);
  --border-strong: rgba(232, 234, 240, 0.16);
  --accent: #60a5fa;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-0);
  color: var(--fg-0);
  font-family: "IBM Plex Sans", sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 1;
}

canvas { display: block; }

/* Ambient grain */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background-image:
    radial-gradient(ellipse at 20% 15%, rgba(96, 165, 250, 0.08), transparent 40%),
    radial-gradient(ellipse at 85% 80%, rgba(236, 64, 122, 0.05), transparent 40%);
}

/* ==================== TOP HEADER ==================== */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 24px 32px 20px;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(10, 13, 20, 0.85) 0%, transparent 100%);
  pointer-events: none;
}

#header-inner {
  display: flex;
  align-items: baseline;
  gap: 20px;
  flex-wrap: wrap;
}

.brand {
  font-family: "Fraunces", serif;
  font-weight: 300;
  font-size: 28px;
  letter-spacing: -0.02em;
  color: var(--fg-0);
  font-style: italic;
}

.brand em {
  font-style: normal;
  font-weight: 500;
}

.subtitle {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-2);
}

.stats-inline {
  margin-left: auto;
  display: flex;
  gap: 28px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--fg-1);
}

.stats-inline .k {
  color: var(--fg-2);
  margin-right: 6px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.stats-inline .v {
  color: var(--fg-0);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* ==================== LEGEND (right top) ==================== */
#legend {
  position: fixed;
  top: 88px;
  right: 24px;
  width: 220px;
  padding: 18px 18px 14px;
  background: rgba(15, 20, 32, 0.7);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid var(--border);
  border-radius: 2px;
  z-index: 30;
  pointer-events: auto;
}

.legend-title {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-2);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  cursor: pointer;
  transition: opacity 0.15s ease;
  font-size: 12px;
}

.legend-row:hover { opacity: 0.75; }

.legend-row.dimmed {
  opacity: 0.28;
}

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.legend-label {
  font-family: "IBM Plex Sans", sans-serif;
  color: var(--fg-0);
  flex: 1;
  letter-spacing: 0.01em;
}

.legend-count {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
}

/* ==================== DETAIL PANEL (right bottom) ==================== */
#detail {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 340px;
  max-height: calc(100vh - 360px);
  overflow-y: auto;
  padding: 22px 22px 20px;
  background: rgba(15, 20, 32, 0.82);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  z-index: 30;
  pointer-events: auto;
  display: none;
}

#detail.visible { display: block; }

.detail-category {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.detail-category .cat-dot {
  width: 8px; height: 8px; border-radius: 50%;
}

.detail-label {
  font-family: "Fraunces", serif;
  font-weight: 400;
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
  line-height: 1.2;
  color: var(--fg-0);
}

.detail-id {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  color: var(--fg-2);
  word-break: break-all;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  line-height: 1.5;
}

.detail-props {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  line-height: 1.6;
}

.detail-prop {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 10px;
  padding: 4px 0;
}

.detail-prop-key {
  color: var(--fg-2);
  letter-spacing: 0.04em;
}

.detail-prop-val {
  color: var(--fg-0);
  word-break: break-word;
}

.detail-prop-val .severity-error { color: #ff9800; font-weight: 500; }
.detail-prop-val .severity-fatal { color: #ef5350; font-weight: 600; }
.detail-prop-val .severity-warn  { color: #ffd54f; }

.detail-connections {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  color: var(--fg-1);
}

.detail-connections-title {
  color: var(--fg-2);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-size: 9px;
}

.detail-link {
  padding: 2px 0;
  cursor: pointer;
  transition: color 0.15s;
}

.detail-link:hover { color: var(--accent); }

.detail-link-type {
  color: var(--fg-2);
  margin-right: 6px;
}

.detail-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: transparent;
  border: 0;
  color: var(--fg-2);
  cursor: pointer;
  font-family: "IBM Plex Mono", monospace;
  font-size: 14px;
  padding: 4px 8px;
}

.detail-close:hover { color: var(--fg-0); }

/* ==================== SEARCH (left bottom) ==================== */
#search-box {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 320px;
  padding: 16px 18px 14px;
  background: rgba(15, 20, 32, 0.75);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid var(--border);
  border-radius: 2px;
  z-index: 30;
}

.search-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-2);
  margin-bottom: 8px;
}

.search-input {
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border-strong);
  padding: 6px 0;
  color: var(--fg-0);
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 14px;
  outline: none;
  letter-spacing: 0.01em;
}

.search-input:focus { border-bottom-color: var(--accent); }

.search-input::placeholder { color: var(--fg-2); }

.search-hint {
  margin-top: 8px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  color: var(--fg-2);
  letter-spacing: 0.04em;
}

.kbd {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  background: var(--bg-2);
  font-family: "IBM Plex Mono", monospace;
  font-size: 9px;
  color: var(--fg-1);
  margin: 0 2px;
}

/* ==================== HOVER TOOLTIP ==================== */
#tooltip {
  position: fixed;
  pointer-events: none;
  padding: 8px 12px;
  background: rgba(15, 20, 32, 0.96);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--fg-0);
  z-index: 40;
  display: none;
  max-width: 320px;
  line-height: 1.4;
}

#tooltip .tt-cat {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-2);
  margin-bottom: 2px;
}

/* ==================== LOADING ==================== */
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg-0);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s ease;
}

#loading.done {
  opacity: 0;
  pointer-events: none;
}

.loading-text {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-2);
  animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ==================== RESPONSIVE ==================== */
@media (max-width: 900px) {
  #header { padding: 18px 20px; }
  .brand { font-size: 22px; }
  .stats-inline { display: none; }
  #legend { top: 72px; right: 16px; width: 180px; }
  #detail { width: calc(100vw - 32px); right: 16px; left: 16px; max-height: 260px; }
  #search-box {
    left: 16px;
    bottom: 16px;
    width: min(320px, calc(100vw - 32px));
    padding: 12px 14px 13px;
    backdrop-filter: blur(12px);
  }
  .search-hint { display: none; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="loading-text">loading ontology…</div>
</div>

<div id="canvas-container"></div>

<header id="header">
  <div id="header-inner">
    <div>
      <div class="brand"><em>RoboOnto</em> <span style="color: var(--fg-2)">·</span> <em>Unitree Robotics G1 EDU (23-DOF)</em> Ontology Atlas</div>
      <div class="subtitle">v0.1 · 3d force-directed semantic graph</div>
    </div>
    <div class="stats-inline">
      <div><span class="k">NODES</span><span class="v" id="stat-nodes">—</span></div>
      <div><span class="k">LINKS</span><span class="v" id="stat-links">—</span></div>
      <div><span class="k">TYPES</span><span class="v" id="stat-types">—</span></div>
      <div><span class="k">ACTIONS</span><span class="v" id="stat-actions">—</span></div>
    </div>
  </div>
</header>

<aside id="legend">
  <div class="legend-title">Categories · filter</div>
  <div id="legend-body"></div>
</aside>

<aside id="detail">
  <button class="detail-close" onclick="app.closeDetail()">✕</button>
  <div class="detail-category"><span class="cat-dot" id="d-catdot"></span><span id="d-cat">—</span></div>
  <div class="detail-label" id="d-label">—</div>
  <div class="detail-id" id="d-id">—</div>
  <div class="detail-props" id="d-props"></div>
  <div class="detail-connections" id="d-conns"></div>
</aside>

<div id="search-box">
  <div class="search-label">search nodes</div>
  <input class="search-input" id="search-input" placeholder="try: elbow, PMU, velocity, L10…" autocomplete="off">
  <div class="search-hint">
    <span class="kbd">drag</span> rotate &nbsp;
    <span class="kbd">wheel</span> zoom &nbsp;
    <span class="kbd">click</span> inspect
  </div>
</div>

<div id="tooltip"></div>

(function() {
  const status = document.querySelector('.loading-text');
  function reportError(prefix, err) {
    const msg = err && err.message ? err.message : String(err);
    if (status) status.textContent = `${prefix}: ${msg}`.slice(0, 140);
  }
  window.addEventListener('error', (event) => {
    reportError('runtime error', event.error || event.message);
  });
  window.addEventListener('unhandledrejection', (event) => {
    reportError('promise error', event.reason);
  });
})();

(function() {
  const sources = [
    './three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  ];
  const status = document.querySelector('.loading-text');

  function tryLoad(index) {
    if (index >= sources.length) {
      if (status) status.textContent = 'failed to load three.js';
      return;
    }
    const script = document.createElement('script');
    script.src = sources[index];
    script.onload = () => {
      try {
        init();
      } catch (err) {
        if (status) {
          const msg = err && err.message ? err.message : String(err);
          status.textContent = `init failed: ${msg}`.slice(0, 140);
        }
      }
    };
    script.onerror = () => {
      script.remove();
      tryLoad(index + 1);
    };
    document.head.appendChild(script);
  }

  tryLoad(0);
})();

// ==================== App state ====================
const app = {
  scene: null, camera: null, renderer: null, raycaster: null,
  nodes: [], links: [],
  meshById: {},
  nodeById: {},
  adjacency: new Map(),
  lineObjects: [],
  selected: null,
  hovered: null,
  filteredOut: new Set(),
  matchedIds: new Set(),
  searchFocusIds: new Set(),
  searchCenterId: null,
  simStep: 0,
  simActive: true,

  // camera sphere coords
  camRadius: 320,
  camTheta: Math.PI * 0.35,   // horizontal
  camPhi: Math.PI * 0.42,     // vertical (from +Y)
  camTarget: { x: 0, y: 0, z: 0 },

  // Force layout params
  REPULSION: 1200,
  SPRING: 0.06,
  REST_LENGTH: 48,
  CENTER_GRAVITY: 0.008,
  DAMPING: 0.85,
  MAX_SIM_STEPS: 600,
};

window.app = app;

// ==================== Init ====================
function init() {
  const container = document.getElementById('canvas-container');
  const W = window.innerWidth, H = window.innerHeight;

  // Scene
  app.scene = new THREE.Scene();
  app.scene.fog = new THREE.FogExp2(0x0a0d14, 0.0018);

  // Camera
  app.camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 2000);
  updateCameraPos();

  // Renderer
  app.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  app.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  app.renderer.setSize(W, H);
  app.renderer.setClearColor(0x0a0d14, 1);
  container.appendChild(app.renderer.domElement);

  // Lights
  app.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 0.6);
  key.position.set(120, 180, 120);
  app.scene.add(key);
  const rim = new THREE.DirectionalLight(0x60a5fa, 0.25);
  rim.position.set(-180, -120, -100);
  app.scene.add(rim);

  // Build graph
  buildGraph();

  // Raycaster for hover/click
  app.raycaster = new THREE.Raycaster();
  app.mouse = new THREE.Vector2(-10, -10);

  // UI
  buildLegend();
  buildStats();
  bindInput();

  // Hide loading
  setTimeout(() => {
    const loading = document.getElementById('loading');
    loading.classList.add('done');
    setTimeout(() => {
      loading.style.display = 'none';
    }, 420);
  }, 400);

  // Animation loop
  animate();
}

// ==================== Camera ====================
function updateCameraPos() {
  const r = app.camRadius;
  const x = app.camTarget.x + r * Math.sin(app.camPhi) * Math.cos(app.camTheta);
  const y = app.camTarget.y + r * Math.cos(app.camPhi);
  const z = app.camTarget.z + r * Math.sin(app.camPhi) * Math.sin(app.camTheta);
  app.camera.position.set(x, y, z);
  app.camera.lookAt(app.camTarget.x, app.camTarget.y, app.camTarget.z);
}

// ==================== Build graph ====================
function buildGraph() {
  const d = GRAPH_DATA;

  // Initial layout: by category cluster
  const cats = Object.keys(d.category_colors);
  const catAngles = {};
  cats.forEach((c, i) => {
    catAngles[c] = (i / cats.length) * Math.PI * 2;
  });

  app.nodes = d.nodes.map((n, i) => {
    // Initial position: cluster by category
    const angle = catAngles[n.category] + (Math.random() - 0.5) * 0.6;
    const clusterR = 100 + Math.random() * 60;
    const y = (Math.random() - 0.5) * 100;
    const x = Math.cos(angle) * clusterR + (Math.random() - 0.5) * 30;
    const z = Math.sin(angle) * clusterR + (Math.random() - 0.5) * 30;

    const size = 1.6 + Math.sqrt(n.degree) * 1.2;
    const color = new THREE.Color(n.color);

    const geometry = new THREE.SphereGeometry(size, 12, 10);
    const material = new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 0.35,
      transparent: true,
      opacity: 0.95,
      roughness: 0.4,
      metalness: 0.2,
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.userData = { node: n, baseColor: color.clone(), size };
    app.scene.add(mesh);
    app.meshById[n.id] = mesh;
    app.nodeById[n.id] = n;

    return {
      ...n,
      mesh,
      x, y, z,
      vx: 0, vy: 0, vz: 0,
      size,
    };
  });

  // Links
  const lineMat = new THREE.LineBasicMaterial({
    color: 0x8899aa,
    transparent: true,
    opacity: 0.18,
  });

  app.links = d.links.map(l => {
    const src = app.nodes.find(n => n.id === l.source);
    const tgt = app.nodes.find(n => n.id === l.target);
    if (!src || !tgt) return null;

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute([
      src.x, src.y, src.z, tgt.x, tgt.y, tgt.z,
    ], 3));
    const line = new THREE.Line(geom, lineMat.clone());
    app.scene.add(line);
    return { src, tgt, type: l.type, line };
  }).filter(Boolean);

  app.lineObjects = app.links.map(l => l.line);

  for (const nd of app.nodes) {
    app.adjacency.set(nd.id, new Set());
  }
  for (const l of app.links) {
    app.adjacency.get(l.src.id)?.add(l.tgt.id);
    app.adjacency.get(l.tgt.id)?.add(l.src.id);
  }
}

// ==================== Force layout ====================
function stepSimulation() {
  const n = app.nodes.length;

  // Repulsion (O(n^2) — 204 nodes is fine)
  for (let i = 0; i < n; i++) {
    const a = app.nodes[i];
    for (let j = i + 1; j < n; j++) {
      const b = app.nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      let d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < 0.01) d2 = 0.01;
      const d = Math.sqrt(d2);
      const f = app.REPULSION / d2;
      const fx = (dx / d) * f, fy = (dy / d) * f, fz = (dz / d) * f;
      a.vx -= fx; a.vy -= fy; a.vz -= fz;
      b.vx += fx; b.vy += fy; b.vz += fz;
    }
  }

  // Spring (attractive) on links
  for (const l of app.links) {
    const a = l.src, b = l.tgt;
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.01;
    const delta = d - app.REST_LENGTH;
    const f = app.SPRING * delta;
    const fx = (dx / d) * f, fy = (dy / d) * f, fz = (dz / d) * f;
    a.vx += fx; a.vy += fy; a.vz += fz;
    b.vx -= fx; b.vy -= fy; b.vz -= fz;
  }

  // Center gravity
  for (const nd of app.nodes) {
    nd.vx -= nd.x * app.CENTER_GRAVITY;
    nd.vy -= nd.y * app.CENTER_GRAVITY;
    nd.vz -= nd.z * app.CENTER_GRAVITY;
  }

  // Integrate
  let maxV = 0;
  for (const nd of app.nodes) {
    nd.vx *= app.DAMPING; nd.vy *= app.DAMPING; nd.vz *= app.DAMPING;
    nd.x += nd.vx; nd.y += nd.vy; nd.z += nd.vz;
    nd.mesh.position.set(nd.x, nd.y, nd.z);
    const v2 = nd.vx*nd.vx + nd.vy*nd.vy + nd.vz*nd.vz;
    if (v2 > maxV) maxV = v2;
  }

  // Update link geometries
  for (const l of app.links) {
    const pos = l.line.geometry.attributes.position;
    pos.setXYZ(0, l.src.x, l.src.y, l.src.z);
    pos.setXYZ(1, l.tgt.x, l.tgt.y, l.tgt.z);
    pos.needsUpdate = true;
  }

  app.simStep++;
  // stop when stable or step cap
  if (app.simStep > app.MAX_SIM_STEPS || maxV < 0.01) {
    app.simActive = false;
  }
}

// ==================== Animation loop ====================
function animate() {
  requestAnimationFrame(animate);
  if (app.simActive) {
    // multiple steps per frame at start for faster layout
    const steps = app.simStep < 120 ? 3 : 1;
    for (let s = 0; s < steps; s++) stepSimulation();
  }

  // Subtle rotation (scene breathes)
  if (!app.isDragging && !app.simActive) {
    app.camTheta += 0.0003;
    updateCameraPos();
  }

  // Raycast for hover
  app.raycaster.setFromCamera(app.mouse, app.camera);
  const meshes = app.nodes.filter(n => !app.filteredOut.has(n.category)).map(n => n.mesh);
  const intersects = app.raycaster.intersectObjects(meshes);
  const newHover = intersects.length ? intersects[0].object.userData.node : null;

  if (newHover !== app.hovered) {
    app.hovered = newHover;
    if (newHover) {
      document.body.style.cursor = 'pointer';
      showTooltip(newHover);
    } else {
      document.body.style.cursor = '';
      hideTooltip();
    }
  }

  // Apply filter visibility and search focus styling
  const searchActive = app.matchedIds.size > 0;
  for (const nd of app.nodes) {
    const visible = !app.filteredOut.has(nd.category);
    nd.mesh.visible = visible;
    if (!visible) continue;

    const mesh = nd.mesh;
    const isCenter = searchActive && nd.id === app.searchCenterId;
    const isMatched = searchActive && app.matchedIds.has(nd.id);
    const inFocus = searchActive && app.searchFocusIds.has(nd.id);
    const isSelected = app.selected && app.selected.id === nd.id;
    const isHovered = app.hovered && app.hovered.id === nd.id;

    let opacity = 0.95;
    let emissive = 0.35;
    let scale = 1.0;

    if (searchActive) {
      if (isCenter) {
        opacity = 1.0;
        emissive = 1.15;
        scale = 1.95;
      } else if (isMatched) {
        opacity = 1.0;
        emissive = 0.92;
        scale = 1.55;
      } else if (inFocus) {
        opacity = 0.92;
        emissive = 0.62;
        scale = 1.18;
      } else {
        opacity = 0.14;
        emissive = 0.08;
        scale = 0.88;
      }
    }

    if (isSelected) {
      emissive = Math.max(emissive, 1.0);
      opacity = Math.max(opacity, 0.98);
      scale = Math.max(scale, isCenter ? 1.95 : 1.45);
    }
    if (isHovered) {
      emissive = Math.max(emissive, 0.95);
      opacity = Math.max(opacity, 1.0);
      scale = Math.max(scale, isCenter ? 2.05 : 1.6);
    }

    mesh.material.opacity = opacity;
    mesh.material.emissiveIntensity = emissive;
    mesh.scale.set(scale, scale, scale);
  }
  for (const l of app.links) {
    const visible = l.src.mesh.visible && l.tgt.mesh.visible;
    l.line.visible = visible;
    if (!visible) continue;

    if (!searchActive) {
      l.line.material.opacity = 0.18;
      l.line.material.color.setHex(0x8899aa);
      continue;
    }

    const srcFocus = app.searchFocusIds.has(l.src.id);
    const tgtFocus = app.searchFocusIds.has(l.tgt.id);
    const touchesCenter = l.src.id === app.searchCenterId || l.tgt.id === app.searchCenterId;

    if (srcFocus && tgtFocus) {
      l.line.material.opacity = touchesCenter ? 0.46 : 0.26;
      l.line.material.color.setHex(touchesCenter ? 0xf4d35e : 0x9cc7ff);
    } else if (srcFocus || tgtFocus) {
      l.line.material.opacity = 0.08;
      l.line.material.color.setHex(0x5f6b78);
    } else {
      l.line.material.opacity = 0.02;
      l.line.material.color.setHex(0x44505c);
    }
  }

  app.renderer.render(app.scene, app.camera);
}

// ==================== Tooltip ====================
function showTooltip(node) {
  const tt = document.getElementById('tooltip');
  tt.innerHTML =
    `<div class="tt-cat" style="color:${node.color}">${node.category} · ${node.type}</div>` +
    `<div>${escapeHtml(node.label)}</div>`;
  tt.style.display = 'block';
}
function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ==================== Input binding ====================
function bindInput() {
  const dom = app.renderer.domElement;
  let dragStart = null;

  dom.addEventListener('mousedown', (e) => {
    dragStart = { x: e.clientX, y: e.clientY, theta: app.camTheta, phi: app.camPhi };
    app.isDragging = true;
  });
  window.addEventListener('mouseup', () => {
    app.isDragging = false;
  });
  window.addEventListener('mousemove', (e) => {
    app.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    app.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    const tt = document.getElementById('tooltip');
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY - 8) + 'px';

    if (app.isDragging && dragStart) {
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      app.camTheta = dragStart.theta - dx * 0.005;
      app.camPhi = dragStart.phi - dy * 0.005;
      app.camPhi = Math.max(0.15, Math.min(Math.PI - 0.15, app.camPhi));
      updateCameraPos();
    }
  });

  dom.addEventListener('wheel', (e) => {
    e.preventDefault();
    app.camRadius *= (1 + e.deltaY * 0.0008);
    app.camRadius = Math.max(80, Math.min(900, app.camRadius));
    updateCameraPos();
  }, { passive: false });

  dom.addEventListener('click', (e) => {
    if (app.isDragging) return;
    // If we were dragging a lot, don't treat as click (simplified)
    if (app.hovered) {
      selectNode(app.hovered);
    } else {
      closeDetail();
    }
  });

  // Touch (basic)
  dom.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY,
                    theta: app.camTheta, phi: app.camPhi };
      app.isDragging = true;
    }
  });
  dom.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && dragStart) {
      const dx = e.touches[0].clientX - dragStart.x;
      const dy = e.touches[0].clientY - dragStart.y;
      app.camTheta = dragStart.theta - dx * 0.005;
      app.camPhi = dragStart.phi - dy * 0.005;
      app.camPhi = Math.max(0.15, Math.min(Math.PI - 0.15, app.camPhi));
      updateCameraPos();
      e.preventDefault();
    }
  }, { passive: false });
  dom.addEventListener('touchend', () => { app.isDragging = false; });

  window.addEventListener('resize', onResize);

  // Search
  const si = document.getElementById('search-input');
  si.addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    applySearch(q);
  });
}

function onResize() {
  const W = window.innerWidth, H = window.innerHeight;
  app.camera.aspect = W / H;
  app.camera.updateProjectionMatrix();
  app.renderer.setSize(W, H);
}

// ==================== Legend / Filter ====================
function buildLegend() {
  const body = document.getElementById('legend-body');
  const d = GRAPH_DATA;
  const preferredOrder = [
    'hardware',
    'software',
    'interface',
    'behavior',
    'event',
    'frame',
    'meta',
    'action',
  ];
  const order = preferredOrder.filter(cat => cat in d.category_colors);
  for (const cat of order) {
    const count = d.stats.categories[cat] || 0;
    const row = document.createElement('div');
    row.className = 'legend-row';
    if (count === 0) {
      row.classList.add('dimmed');
    }
    row.innerHTML =
      `<span class="legend-swatch" style="background:${d.category_colors[cat]}"></span>` +
      `<span class="legend-label">${cat}</span>` +
      `<span class="legend-count">${count}</span>`;
    if (count > 0) {
      row.addEventListener('click', () => toggleFilter(cat, row));
    }
    body.appendChild(row);
  }
}

function toggleFilter(cat, row) {
  if (app.filteredOut.has(cat)) {
    app.filteredOut.delete(cat);
    row.classList.remove('dimmed');
  } else {
    app.filteredOut.add(cat);
    row.classList.add('dimmed');
  }
}

function buildStats() {
  const d = GRAPH_DATA;
  document.getElementById('stat-nodes').textContent = d.stats.total_nodes;
  document.getElementById('stat-links').textContent = d.stats.total_links;
  document.getElementById('stat-types').textContent = Object.keys(d.stats.object_types).length + 1;
  document.getElementById('stat-actions').textContent = d.stats.categories.action || 0;
}

function applySearch(query) {
  app.matchedIds.clear();
  app.searchFocusIds.clear();
  app.searchCenterId = null;

  if (!query) {
    return;
  }

  const matches = app.nodes.filter(nd =>
    nd.id.toLowerCase().includes(query) ||
    nd.label.toLowerCase().includes(query) ||
    nd.type.toLowerCase().includes(query)
  );

  if (!matches.length) {
    return;
  }

  matches.sort((a, b) => scoreSearchMatch(b, query) - scoreSearchMatch(a, query));
  const center = matches[0];
  app.searchCenterId = center.id;

  for (const nd of matches) {
    app.matchedIds.add(nd.id);
  }
  for (const id of collectNeighborhood(center.id, 3)) {
    app.searchFocusIds.add(id);
  }
  for (const nd of matches.slice(1, 4)) {
    for (const id of collectNeighborhood(nd.id, 2)) {
      app.searchFocusIds.add(id);
    }
  }
  for (const id of app.matchedIds) {
    app.searchFocusIds.add(id);
  }

  selectNode(center);
  focusOnNode(center);
}

function scoreSearchMatch(node, query) {
  const id = node.id.toLowerCase();
  const label = node.label.toLowerCase();
  const type = node.type.toLowerCase();

  if (label === query || id === query || type === query) return 1000;
  if (label.startsWith(query) || id.startsWith(query)) return 800;
  if (label.includes(query)) return 500;
  if (id.includes(query)) return 400;
  if (type.includes(query)) return 250;
  return 100 + (node.degree || 0);
}

function collectNeighborhood(startId, depth) {
  const visited = new Set([startId]);
  const queue = [{ id: startId, level: 0 }];

  while (queue.length) {
    const { id, level } = queue.shift();
    if (level >= depth) continue;
    for (const nextId of app.adjacency.get(id) || []) {
      if (visited.has(nextId)) continue;
      visited.add(nextId);
      queue.push({ id: nextId, level: level + 1 });
    }
  }

  return visited;
}

// ==================== Select / Detail panel ====================
function selectNode(node) {
  app.selected = node;
  const panel = document.getElementById('detail');

  document.getElementById('d-catdot').style.background = node.color;
  document.getElementById('d-cat').textContent = node.category + ' · ' + node.type;
  document.getElementById('d-label').textContent = node.label;
  document.getElementById('d-id').textContent = node.id;

  // props
  const propsEl = document.getElementById('d-props');
  propsEl.innerHTML = '';
  const props = node.props || {};
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === '') continue;
    const row = document.createElement('div');
    row.className = 'detail-prop';
    let vHtml = escapeHtml(formatVal(v));
    if (k === 'severity') {
      vHtml = `<span class="severity-${v}">${vHtml}</span>`;
    }
    row.innerHTML =
      `<span class="detail-prop-key">${escapeHtml(k)}</span>` +
      `<span class="detail-prop-val">${vHtml}</span>`;
    propsEl.appendChild(row);
  }

  // connections
  const connsEl = document.getElementById('d-conns');
  const outgoing = app.links.filter(l => l.src.id === node.id);
  const incoming = app.links.filter(l => l.tgt.id === node.id);
  let connHtml = '';
  if (outgoing.length) {
    connHtml += `<div class="detail-connections-title">outgoing (${outgoing.length})</div>`;
    for (const l of outgoing.slice(0, 12)) {
      connHtml += `<div class="detail-link" data-id="${l.tgt.id}">` +
                  `<span class="detail-link-type">${l.type}</span>→ ${escapeHtml(l.tgt.label)}</div>`;
    }
  }
  if (incoming.length) {
    connHtml += `<div class="detail-connections-title" style="margin-top:10px">incoming (${incoming.length})</div>`;
    for (const l of incoming.slice(0, 12)) {
      connHtml += `<div class="detail-link" data-id="${l.src.id}">` +
                  `<span class="detail-link-type">← ${l.type}</span>${escapeHtml(l.src.label)}</div>`;
    }
  }
  connsEl.innerHTML = connHtml;
  connsEl.querySelectorAll('.detail-link').forEach(el => {
    el.addEventListener('click', () => {
      const nid = el.getAttribute('data-id');
      const n = app.nodes.find(x => x.id === nid);
      if (n) { selectNode(n); focusOnNode(n); }
    });
  });

  panel.classList.add('visible');
}

app.closeDetail = function() {
  document.getElementById('detail').classList.remove('visible');
  app.selected = null;
};

function focusOnNode(node) {
  app.camTarget = { x: node.x, y: node.y, z: node.z };
  const offset = new THREE.Vector3(
    app.camera.position.x - node.x,
    app.camera.position.y - node.y,
    app.camera.position.z - node.z
  );
  if (offset.lengthSq() < 1e-6) {
    offset.set(0, 30, 180);
  }
  const dir = offset.normalize();
  app.camTheta = Math.atan2(dir.z, dir.x);
  app.camPhi = Math.acos(dir.y);
  app.camRadius = Math.max(140, Math.min(360, node.size * 28 + 170));
  updateCameraPos();
}

// ==================== Utilities ====================
function formatVal(v) {
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}
