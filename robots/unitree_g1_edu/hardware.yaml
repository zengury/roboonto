# Unitree G1 EDU — Hardware Ontology (perception sensors)
# ======================================================================
# Non-URDF hardware whose semantics the URDF cannot carry. The URDF only
# gives us the mount *links* (mid360_link, d435_link); this file adds the
# Sensor objects that say what those links actually are, and mounts them
# back onto their links via `mounted_on`.
#
# Compute / Power / IMU / BMS objects live alongside the URDF links in
# kinematics.yaml (they were added there by the URDF import pass).
#
# Sources:
#   • Head sensor suite (3D LiDAR + depth camera) — Unitree G1 product spec,
#     corroborated by the URDF mount links mid360_link / d435_link.
# ======================================================================

objects:

  # ── 3D LiDAR ───────────────────────────────────────────────────────
  - type: Sensor
    id: unitree_g1_edu.hw.sensor.lidar
    properties:
      name: 头部 3D 激光雷达
      sensor_type: lidar
      vendor: Livox
      model: Mid-360
      fov: 360° horizontal × 59° vertical
      mount_link: unitree_g1_edu.hw.link.mid360_link
      notes: 头部 3D LiDAR。URDF 中以 mid360_link 存在；配置相关（含 LiDAR 头的 EDU 版）。
    source:
      type: document
      confidence: medium
      locator: "Unitree G1 product spec; g1_23dof_rev_1_0.urdf#link[mid360_link]"

  # ── 深度相机 ───────────────────────────────────────────────────────
  - type: Sensor
    id: unitree_g1_edu.hw.sensor.depth_camera
    properties:
      name: 头部深度相机
      sensor_type: depth_camera
      vendor: Intel
      model: RealSense D435
      mount_link: unitree_g1_edu.hw.link.d435_link
      notes: 头部前向 RGB-D 深度相机。URDF 中以 d435_link 存在。
    source:
      type: document
      confidence: medium
      locator: "Unitree G1 product spec; g1_23dof_rev_1_0.urdf#link[d435_link]"

links:
  # Mount perception sensors back onto their URDF links.
  - {type: mounted_on, source: unitree_g1_edu.hw.sensor.lidar, target: unitree_g1_edu.hw.link.mid360_link}
  - {type: mounted_on, source: unitree_g1_edu.hw.sensor.depth_camera, target: unitree_g1_edu.hw.link.d435_link}
  # IMU is mounted in the pelvis link.
  - {type: mounted_on, source: unitree_g1_edu.hw.sensor.imu, target: unitree_g1_edu.hw.link.imu_in_pelvis}
