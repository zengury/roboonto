# MY_ROBOT — Hardware Ontology
# ======================================================================
# 物理实体: Link(连杆), Joint(关节), Sensor(传感器),
#           ComputeUnit(计算单元), PowerSubsystem(电源), EndEffector(末端)
#
# 数据来源:
#   • URDF 文件 — Link/Joint 的权威来源 (用 roboonto import urdf 自动抽取)
#   • 产品规格文档 — Sensor/ComputeUnit/Power 参数
#   • SDK 文档 — 传感器型号/参数
# ======================================================================

objects:

# ── 计算单元 ───────────────────────────────────────────────────
# 从产品文档 §1.3 获取。至少声明一个开发计算单元。

# - type: ComputeUnit
#   id: MY_ROBOT.hw.compute.main
#   properties:
#     role: development            # motion_control / development / interaction / perception
#     network_address: 10.0.1.XX
#     soc: "Jetson Orin NX"
#     cpu: "8-core Arm Cortex-A78AE"
#     gpu: "1024-core Ampere"
#     memory_gb: 16
#     storage_gb: 512
#   source:
#     type: document
#     locator: "产品文档 §1.3"


# ── 电源 ───────────────────────────────────────────────────────
# 从产品文档 §1.2 获取

# - type: PowerSubsystem
#   id: MY_ROBOT.hw.power
#   properties:
#     battery_wh: 0
#     battery_voltage_nominal: 0
#     pmu_bus_voltages: ["48V", "12V", "5V"]
#   source:
#     type: document
#     locator: "产品文档 §1.2"


# ── 传感器 ─────────────────────────────────────────────────────
# 从产品文档 §1.6 获取。每个传感器声明一个。

# - type: Sensor
#   id: MY_ROBOT.hw.sensor.imu_chest
#   properties:
#     sensor_kind: imu
#     vendor: "?"
#     model: "?"
#     mount_link: MY_ROBOT.hw.link.chest
#     attached_to: MY_ROBOT.hw.compute.main
#   source:
#     type: document
#     locator: "产品文档 §1.6"


# ── Link (连杆) — 由 URDF Importer 自动生成 ─────────────────
# 不要手写。运行: roboonto import urdf <path/to/robot.urdf>


# ── Joint (关节) — 由 URDF Importer 自动生成 ───────────────
# 不要手写。运行: roboonto import urdf <path/to/robot.urdf>
# 生成后人工审核: name_human, position_limit, effort_limit
