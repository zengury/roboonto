- id: agibot_x2.action.play_media_file
  binding: agibot_x2.binding.play_media_file
  parameters:
  - name: file_name
    type:
      kind: string
    required: true
  - name: priority_level
    type:
      kind: entity
      name: PriorityLevel
    required: true
    default:
      kind: ref
      value: agibot_x2.priority.interaction_l6
      target_type: PriorityLevel
  - name: priority_weight
    type:
      kind: int
    required: true
    default:
      kind: int
      value: 50
    constraints:
    - kind: range
      min: 0
      max: 99
  - name: domain
    type:
      kind: string
    required: true
  - name: is_interrupted
    type:
      kind: bool
    required: true
    default:
      kind: bool
      value: false
