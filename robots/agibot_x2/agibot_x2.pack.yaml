- id: agibot_x2.evidence_boundary.mode_switch
  subject: mode_switch
  status: open
  kind: observability
  provider_receipt_is_effect_evidence: false
  required_verification_sources:
  - agibot_x2.action.get_mc_action
  attributes:
  - name: discovered
    value:
      kind: string
      value: '2026-05-04'
  - name: discovered_by
    value:
      kind: string
      value: test_day + crash_diagnosis
  - name: fix
    value:
      kind: string
      value: 固件层面修复 SetMcAction 返回值。
  - name: impact
    value:
      kind: string
      value: 模式切换假阳性导致 Agent 基于错误模式发送关节指令，可能引发摔机。
  - name: reason
    value:
      kind: string
      value: 'SetMcAction ROS2 服务存在已知固件 bug：返回 success 但 MC 控制器未实际切换模式。 HDS 诊断系统不检测此异常（16:10:12 诊断码为空）。 EC/DM/cobridge 模块均不记录模式切换操作。
        唯一记录来源是 robot/app.py (FastAPI) 的 loguru 日志。

        '
  - name: recorded_by_internal_modules
    value:
      kind: bool
      value: false
  - name: recorded_by_robot_app
    value:
      kind: bool
      value: true
  - name: service
    value:
      kind: string
      value: /aimdk_msgs/srv/SetMcAction
  - name: workaround
    value:
      kind: string
      value: 每次 SetMcAction 后必须立即 GetMcAction 验证实际模式。验证逻辑应在 runtime safety gate 中强制执行。
