target_actions:
- id: agibot_x2.action.delete_input_source
  binding: agibot_x2.binding.delete_input_source
  parameters:
  - name: name
    type:
      kind: string
    required: true
  guards:
  - formula:
      kind: compare
      operator: not_in
      left:
        kind: ref
        scope: parameter
        path: name
      right:
        kind: list
        items:
        - kind: literal
          value: rc
        - kind: literal
          value: vr
        - kind: literal
          value: app_proxy
        - kind: literal
          value: interaction
        - kind: literal
          value: pnc
    code: PACK-GUARD-DELETE_INPUT_SOURCE-1
    message: 不允许删除系统内置输入源
    severity: error
  resource_sets:
  - agibot_x2.resource.delete_input_source
  safety_class: config
  visibility: executor
  world_effect: null
  executable: true
  legacy_id: delete_input_source
  provenance:
  - prov:5dac7eeb45a01b12
