- id: agibot_x2.evidence_boundary.runtime_event_persistence
  subject: runtime_event_persistence
  status: resolved
  kind: observability
  attributes:
  - name: discovered
    value:
      kind: string
      value: '2026-05-04'
  - name: discovered_by
    value:
      kind: string
      value: test_day + crash_diagnosis
  - name: fix
    value:
      kind: string
      value: Path() 修复已完成 (runtime.py:63)。需验证 ledger.db 持续写入。
  - name: impact
    value:
      kind: string
      value: Runtime events 仅存于内存 (500 条上限)，daemon 重启后全部丢失。
  - name: ledger_db
    value:
      kind: bool
      value: false
  - name: reason
    value:
      kind: string
      value: 'Ledger (ledger.db) 从未被写入过数据 — daemon 启动时有 Path() bug (Issue #1) 导致初始化失败。修复后首次正常启动，但历史数据全无。'
