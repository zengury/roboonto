- id: agibot_x2.control_loop.mc_arbitration
  type: ControlLoop
  attributes:
  - name: arbitrates_topics
    value:
      kind: list
      items:
      - kind: string
        value: /aima/mc/locomotion/velocity
  - name: arbitration_rules
    value:
      kind: list
      items:
      - kind: string
        value: 被禁用的输入源和未知输入源,其控制指令被丢弃
      - kind: string
        value: 从未被丢弃指令的输入源中选定最高优先级的有效输入源,只接受其控制
      - kind: string
        value: 出现非选定的更高优先级有效输入源时,改选其作为选定输入源
      - kind: string
        value: 选定输入源非活跃状态(timeout等)则被视为最低优先级,将从活跃的其他有效控制源中重新选定
  - name: description
    value:
      kind: string
      value: 对多个控制输入源做优先级实时仲裁,选择最高优先级活跃源的指令
  - name: frequency_hz
    value:
      kind: 'null'
  - name: name_human
    value:
      kind: string
      value: MC 输入源仲裁回路
  - name: notes
    value:
      kind: string
      value: 系统重启后输入源优先级状态将重置
  provenance:
  - prov:5dac7eeb45a01b12
