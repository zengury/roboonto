$schema: https://roboonto.dev/schema/packmodule-0.9.json
pack_version: '0.9'
module:
  kind: target_pack
  id: agibot_x2
  version: 0.9.0
  target: agibot_x2
  firmware: '0.8'
  vendor: AgiBot
  model: X2 Ultra (旗舰版)
  description: '智元 X2 Ultra 旗舰版人形机器人。30 主动 DOF,三套计算单元

    (PC1 运控 / PC2 开发 / PC3 交互),激光雷达 + RGBD + 双目 + 交互 + 后视相机,

    可选 OmniPicker 夹爪 / OmniHand 灵巧手。'
  content_digest: sha256:e19559c3b01be9fd8c6b3d12f22c1e54c66688317813ebecec5edf4f9e9fcb03
  attributes:
  - name: legacy_action_count
    value:
      kind: int
      value: 22
  - name: legacy_object_count
    value:
      kind: int
      value: 256
  - name: legacy_relation_count
    value:
      kind: int
      value: 403
  - name: legacy_roboonto_version
    value:
      kind: string
      value: 0.3.0
  - name: ros2_version
    value:
      kind: string
      value: Humble
  - name: standard_mappings
    value:
      kind: record
      fields:
      - name: notes
        value:
          kind: record
          fields:
          - name: design_rule
            value:
              kind: string
              value: 'API/interface objects explain how to call the robot; Capability objects explain what the robot can do
                and which component provides that function.

                '
      - name: standards
        value:
          kind: list
          items:
          - kind: record
            fields:
            - name: id
              value:
                kind: string
                value: ieee_1872_2_aur
            - name: mappings
              value:
                kind: record
                fields:
                - name: AutonomousCapability
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: Capability
                - name: AutonomousRobot
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: robot
                - name: AutonomousSystem
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: SoftwareComponent
                - name: Environment
                  value:
                    kind: record
                    fields:
                    - name: roboonto_property
                      value:
                        kind: string
                        value: environment_requirements
                - name: Task
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: ServiceRequirement
            - name: name
              value:
                kind: string
                value: IEEE 1872.2 Autonomous Robotics Ontology
            - name: role
              value:
                kind: string
                value: standard_term_anchor
          - kind: record
            fields:
            - name: id
              value:
                kind: string
                value: cora
            - name: mappings
              value:
                kind: record
                fields:
                - name: PhysicalEnvironment
                  value:
                    kind: record
                    fields:
                    - name: roboonto_property
                      value:
                        kind: string
                        value: environment_requirements
                - name: Robot
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: robot
                - name: RobotPart
                  value:
                    kind: record
                    fields:
                    - name: roboonto_types
                      value:
                        kind: list
                        items:
                        - kind: string
                          value: Link
                        - kind: string
                          value: Joint
                        - kind: string
                          value: Sensor
                        - kind: string
                          value: EndEffector
                - name: RoboticSystem
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: SoftwareComponent
            - name: name
              value:
                kind: string
                value: IEEE 1872.1 Core Ontologies for Robotics and Automation
            - name: role
              value:
                kind: string
                value: core_robotics_term_anchor
          - kind: record
            fields:
            - name: id
              value:
                kind: string
                value: roso
            - name: mappings
              value:
                kind: record
                fields:
                - name: Actuation
                  value:
                    kind: record
                    fields:
                    - name: roboonto_capability_kind
                      value:
                        kind: string
                        value: actuation
                - name: Component
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: SoftwareComponent
                - name: Function
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: Capability
                - name: Sensing
                  value:
                    kind: record
                    fields:
                    - name: roboonto_capability_kind
                      value:
                        kind: string
                        value: sensing
                - name: ServiceRequirement
                  value:
                    kind: record
                    fields:
                    - name: roboonto_type
                      value:
                        kind: string
                        value: ServiceRequirement
                - name: detects
                  value:
                    kind: record
                    fields:
                    - name: roboonto_link_type
                      value:
                        kind: string
                        value: detects
                - name: hasParameter
                  value:
                    kind: record
                    fields:
                    - name: roboonto_link_type
                      value:
                        kind: string
                        value: has_parameter
                - name: provides
                  value:
                    kind: record
                    fields:
                    - name: roboonto_link_type
                      value:
                        kind: string
                        value: provides_capability
            - name: name
              value:
                kind: string
                value: Robotic Service Ontology
            - name: role
              value:
                kind: string
                value: service_capability_model
types:
- id: App
  category: software
  description: 外部 App(手机端/平板/遥控器 firmware)
  attributes:
  - name: id
    type:
      kind: string
    required: false
  - name: min_firmware
    type:
      kind: string
    required: false
  - name: platform
    type:
      kind: enum
      values:
      - ios
      - android
      - controller_fw
      - web
    required: false
- id: Capability
  category: capability
  description: 组件或传感器提供的功能语义,回答“能做什么”,再由 Topic/Service/Action 说明“怎么调用”
  attributes:
  - name: boundaries
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: capability_kind
    type:
      kind: enum
      values:
      - sensing
      - actuation
      - perception
      - localization
      - mapping
      - planning
      - navigation
      - manipulation
      - diagnosis
      - communication
      - interaction
    required: false
  - name: consumes
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: description
    type:
      kind: string
    required: false
  - name: detects
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: environment_requirements
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: name_human
    type:
      kind: string
    required: false
  - name: produces
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: qos
    type:
      kind: record
      name: map
    required: false
  - name: standard_mappings
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
- id: CapabilityParameter
  category: capability
  description: Capability 的语义参数,用于描述检测区域、阈值、周期、精度等能力条件
  attributes:
  - name: constraints
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: default
    type:
      kind: opaque
      name: any
    required: false
  - name: description
    type:
      kind: string
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: name
    type:
      kind: string
    required: false
  - name: required
    type:
      kind: bool
    required: false
  - name: unit
    type:
      kind: string
    required: false
  - name: value_type
    type:
      kind: string
    required: false
- id: ComputeUnit
  category: hardware
  description: 计算单元,包含 SoC/CPU/GPU/内存等
  attributes:
  - name: ai_tops
    type:
      kind: float
    required: false
  - name: cpu
    type:
      kind: string
    required: false
  - name: gpu
    type:
      kind: string
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: memory_gb
    type:
      kind: float
    required: false
  - name: network_address
    type:
      kind: string
    required: false
  - name: os
    type:
      kind: string
    required: false
  - name: role
    type:
      kind: enum
      values:
      - motion_control
      - interaction
      - development
      - perception
    required: false
  - name: soc
    type:
      kind: string
    required: false
  - name: storage_gb
    type:
      kind: float
    required: false
- id: ControlLoop
  category: behavior
  description: 运行中的控制回路(如走跑仲裁、PID 回路)
  attributes:
  - name: arbitrates
    type:
      kind: list
      item:
        kind: entity
        name: Topic
    required: false
  - name: frequency_hz
    type:
      kind: float
    required: false
  - name: id
    type:
      kind: string
    required: false
- id: CoordinateFrame
  category: frame
  description: 坐标系,X=红 Y=绿 Z=蓝
  attributes:
  - name: id
    type:
      kind: string
    required: false
  - name: origin
    type:
      kind: record
      name: frame_spec
    required: false
  - name: parent
    type:
      kind: entity
      name: CoordinateFrame
    required: false
- id: EndEffector
  category: hardware
  description: 末端执行器(夹爪/灵巧手),插拔式附件
  attributes:
  - name: dof
    type:
      kind: int
    required: false
  - name: ee_kind
    type:
      kind: enum
      values:
      - gripper
      - dexterous_hand
      - tool_plate
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: mount_joint
    type:
      kind: entity
      name: Joint
    required: false
  - name: payload_kg
    type:
      kind: float
    required: false
- id: FaultCode
  category: event
  description: 显式故障码
- id: InputSource
  category: meta
  description: 控制输入源(遥控/APP/二开程序等),参与优先级仲裁
  attributes:
  - name: display_name
    type:
      kind: string
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: registration_service
    type:
      kind: entity
      name: Service
    required: false
  - name: requires_registration
    type:
      kind: bool
    required: false
- id: Joint
  category: hardware
  description: 单自由度关节,URDF 中的 <joint>,机器人最重要的可控对象之一
  attributes:
  - name: child_link
    type:
      kind: entity
      name: Link
    required: false
  - name: dof_axis
    type:
      kind: enum
      values:
      - pitch
      - roll
      - yaw
      - prismatic_x
      - prismatic_y
      - prismatic_z
    required: false
  - name: effort_limit
    type:
      kind: quantity
      dimension: torque
      unit: Nm
    required: false
  - name: id
    type:
      kind: string
    required: true
  - name: joint_kind
    type:
      kind: enum
      values:
      - revolute
      - continuous
      - prismatic
      - fixed
    required: false
  - name: name_human
    type:
      kind: string
    required: false
  - name: origin
    type:
      kind: record
      name: frame_spec
    required: false
  - name: parent_link
    type:
      kind: entity
      name: Link
    required: false
  - name: position_limit
    type:
      kind: range
      dimension: angle
      unit: rad
    required: false
  - name: torque_peak
    type:
      kind: quantity
      dimension: torque
      unit: Nm
    required: false
  - name: velocity_limit
    type:
      kind: quantity
      dimension: angular_velocity
      unit: rad/s
    required: false
- id: Link
  category: hardware
  description: 机器人刚体连杆,URDF 中的 <link>
  attributes:
  - name: collision_mesh
    type:
      kind: string
    required: false
  - name: id
    type:
      kind: string
    required: true
  - name: inertia
    type:
      kind: record
      name: matrix3x3
    required: false
  - name: mass
    type:
      kind: quantity
      dimension: mass
      unit: kg
    required: false
  - name: name_human
    type:
      kind: string
    required: false
  - name: visual_mesh
    type:
      kind: string
    required: false
- id: Mode
  category: behavior
  description: 机器人整体模态,模式之间的可迁移关系由 transitions link 描述
  attributes:
  - name: allows_actions
    type:
      kind: list
      item:
        kind: entity
        name: ActionType
    required: false
  - name: description
    type:
      kind: string
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: name_human
    type:
      kind: string
    required: false
  - name: required_preconditions
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: safety_note
    type:
      kind: string
    required: false
- id: MsgSchema
  category: interface
  description: 消息类型定义,例如 aimdk_msgs/msg/PmuState
  attributes:
  - name: fields
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: name
    type:
      kind: string
    required: false
  - name: source_file
    type:
      kind: string
    required: false
- id: OTAPackage
  category: software
  description: 整机 OTA 升级包
  attributes:
  - name: affects_components
    type:
      kind: list
      item:
        kind: entity
        name: Entity
    required: false
  - name: release_date
    type:
      kind: string
    required: false
  - name: version
    type:
      kind: string
    required: false
- id: PowerSubsystem
  category: hardware
  description: 电源子系统(电池 + PMU),agent 做诊断的关键对象
  attributes:
  - name: battery_voltage_nominal
    type:
      kind: quantity
      dimension: voltage
      unit: V
    required: false
  - name: battery_wh
    type:
      kind: quantity
      dimension: energy
      unit: Wh
    required: false
  - name: charging_input_v
    type:
      kind: range
      dimension: voltage
      unit: V
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: pmu_bus_voltages
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
- id: PresetMotion
  category: behavior
  description: 厂商预设的原子动作(坐下站起、平躺站起、挥手等)
  attributes:
  - name: duration_s
    type:
      kind: float
    required: false
  - name: environment_requirements
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: forbidden_contexts
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: name_human
    type:
      kind: string
    required: false
- id: PriorityLevel
  category: meta
  description: 优先级级别(如 TTS 的 L1-L10)
  attributes:
  - name: description
    type:
      kind: string
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: preemptable
    type:
      kind: bool
    required: false
  - name: value
    type:
      kind: int
    required: false
- id: Process
  category: software
  description: 运行在某个 ComputeUnit 上的进程
  attributes:
  - name: auto_start
    type:
      kind: bool
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: kind
    type:
      kind: enum
      values:
      - ros_node
      - system_daemon
      - app
      - user_program
    required: false
  - name: lifecycle
    type:
      kind: enum
      values:
      - managed
      - unmanaged
    required: false
  - name: runs_on
    type:
      kind: entity
      name: ComputeUnit
    required: false
- id: ProtectionThreshold
  category: hardware
  description: Legacy extension type normalized by PackModule migration
- id: ROSNode
  category: software
  extends: Process
  description: ROS2 节点,发布/订阅 Topic,提供/调用 Service
  attributes:
  - name: namespace
    type:
      kind: string
    required: false
  - name: ros_package
    type:
      kind: string
    required: false
- id: RobotBody
  category: hardware
  description: Legacy extension type normalized by PackModule migration
- id: SafetyClass
  category: meta
  description: Action 的安全分级
  attributes:
  - name: id
    type:
      kind: string
    required: false
- id: Sensor
  category: hardware
  description: 传感器的通用描述,具体类型通过 sensor_kind 区分
  attributes:
  - name: id
    type:
      kind: string
    required: false
  - name: model
    type:
      kind: string
    required: false
  - name: mount_frame
    type:
      kind: entity
      name: CoordinateFrame
    required: false
  - name: mount_link
    type:
      kind: entity
      name: Link
    required: false
  - name: name_human
    type:
      kind: string
    required: false
  - name: sensor_kind
    type:
      kind: enum
      values:
      - rgb_camera
      - depth_camera
      - stereo_camera
      - imu
      - lidar
      - touch
      - force_torque
    required: false
  - name: specs
    type:
      kind: record
      name: map
    required: false
  - name: vendor
    type:
      kind: string
    required: false
- id: Service
  category: interface
  description: ROS2 服务
  attributes:
  - name: compute_unit
    type:
      kind: entity
      name: ComputeUnit
    required: false
  - name: cross_unit_reliable
    type:
      kind: bool
    required: false
  - name: name
    type:
      kind: string
    required: false
  - name: provider
    type:
      kind: entity
      name: ROSNode
    required: false
  - name: srv_type
    type:
      kind: entity
      name: SrvSchema
    required: false
- id: ServiceRequirement
  category: capability
  description: 任务或服务需求,用于把外部需求映射到机器人能力和约束
  attributes:
  - name: description
    type:
      kind: string
    required: false
  - name: environment
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: name_human
    type:
      kind: string
    required: false
  - name: qos
    type:
      kind: record
      name: map
    required: false
  - name: required_capabilities
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: required_outputs
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: safety_constraints
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
- id: SoftwareComponent
  category: software
  description: 软件组件的语义边界,用于说明组件是什么、提供什么能力,而不只是如何调用 API
  attributes:
  - name: component_kind
    type:
      kind: enum
      values:
      - perception
      - localization
      - mapping
      - planning
      - control
      - diagnostics
      - ui
      - middleware
      - runtime
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: implementation
    type:
      kind: string
    required: false
  - name: lifecycle
    type:
      kind: enum
      values:
      - managed
      - unmanaged
      - external
    required: false
  - name: name_human
    type:
      kind: string
    required: false
  - name: runs_on
    type:
      kind: entity
      name: ComputeUnit
    required: false
  - name: source_uri
    type:
      kind: string
    required: false
  - name: standard_mappings
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
- id: SrvSchema
  category: interface
  description: 服务类型定义
  attributes:
  - name: name
    type:
      kind: string
    required: false
  - name: request_fields
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
  - name: response_fields
    type:
      kind: list
      item:
        kind: opaque
        name: item
    required: false
- id: StatusBit
  category: event
  description: 状态字某一位,典型如 PMU 的 bus48vOverCurrent
  attributes:
  - name: bit_index
    type:
      kind: int
    required: false
  - name: carrier_field
    type:
      kind: string
    required: false
  - name: id
    type:
      kind: string
    required: false
  - name: recommended_action
    type:
      kind: entity
      name: ActionType
    required: false
  - name: semantic
    type:
      kind: string
    required: false
  - name: severity
    type:
      kind: enum
      values:
      - info
      - warn
      - error
      - fatal
    required: false
- id: Topic
  category: interface
  description: ROS2 话题
  attributes:
  - name: bandwidth_mb_s
    type:
      kind: float
    required: false
  - name: compute_unit
    type:
      kind: entity
      name: ComputeUnit
    required: false
  - name: cross_unit_safe
    type:
      kind: bool
    required: false
  - name: frequency_hz
    type:
      kind: float
    required: false
  - name: msg_type
    type:
      kind: entity
      name: MsgSchema
    required: false
  - name: name
    type:
      kind: string
    required: false
  - name: publisher
    type:
      kind: entity
      name: ROSNode
    required: false
  - name: qos
    type:
      kind: enum
      values:
      - RELIABLE
      - BEST_EFFORT
      - TRANSIENT_LOCAL
    required: false
- id: TouchEvent
  category: event
  description: 触摸事件(单击/双击/三击/滑动)
  attributes:
  - name: event_code
    type:
      kind: int
    required: false
  - name: semantic
    type:
      kind: string
    required: false
relation_types:
- id: allows
  source_types:
  - Mode
  target_types:
  - TargetAction
- id: arbitrates
  source_types:
  - ControlLoop
  target_types:
  - Topic
- id: carried_by
  source_types:
