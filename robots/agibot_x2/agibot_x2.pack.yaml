evidence_boundaries:
- id: agibot_x2.evidence_boundary.bag_retention
  subject: bag_retention
  status: open
  kind: observability
  attributes:
  - name: autonomous_retention
    value:
      kind: string
      value: ~28 files (~7.2 GB)
  - name: discovered
    value:
      kind: string
      value: '2026-05-04'
  - name: discovered_by
    value:
      kind: string
      value: crash_diagnosis
  - name: hal_sensor_retention
    value:
      kind: string
      value: ~16 files (~4.2 GB, ~27 min at current rate)
  - name: impact
    value:
      kind: string
      value: 故障发生后如果未及时导出，故障窗口内的 bag 数据会被轮转覆盖。16:10 摔机的 hal_sensor bag 在约 2.5 小时后被覆盖。
  - name: reason
    value:
      kind: string
      value: bag 文件按固定数量和大小轮转，超出容量后最旧文件被删除。
  - name: software_retention
    value:
      kind: string
      value: multiple sessions
- id: agibot_x2.evidence_boundary.chest_imu
  subject: chest_imu
  status: open
  kind: observability
  realtime_available: true
  durable_replay_available: false
  attributes:
  - name: discovered
    value:
      kind: string
      value: '2026-05-04'
  - name: discovered_by
    value:
      kind: string
      value: crash_diagnosis
  - name: fix
    value:
      kind: string
      value: 在 bag 录制配置中增加 /aima/hal/imu/chest/state topic。
  - name: impact
    value:
      kind: string
      value: 无法回溯机器人姿态/倾角历史，无法确定摔机精确时刻和摔倒过程。
  - name: reason
    value:
      kind: string
      value: MCAP 录制仅包含 LiDAR IMU (/aima/hal/sensor/lidar_chest_front/imu)，不含胸部 IMU。
  - name: workaround
    value:
      kind: string
      value: LiDAR IMU 可部分替代，但坐标系不同 (始终报告 0° tilt)。
- id: agibot_x2.evidence_boundary.hds_diagnostic_coverage
  subject: hds_diagnostic_coverage
  status: open
  kind: observability
  attributes:
  - name: covers
    value:
      kind: list
      items:
      - kind: string
        value: SOC1 进程状态 (CPU/内存)
      - kind: string
        value: EtherCAT 总线状态 (probe)
      - kind: string
        value: MC 控制器状态 (probe)
  - name: discovered
    value:
      kind: string
      value: '2026-05-04'
  - name: discovered_by
    value:
      kind: string
      value: crash_diagnosis
  - name: does_not_cover
    value:
      kind: list
      items:
      - kind: string
        value: 关节锁死/失能
      - kind: string
        value: 模式切换失败 (假阳性)
      - kind: string
        value: 关节温度异常 (仅 52V/24V 总线差异标记)
      - kind: string
        value: IMU 倾角异常
      - kind: string
        value: 摔倒检测
  - name: reason
    value:
      kind: string
      value: HDS 诊断系统基于预定义诊断码列表。16:10 摔机时 HDS Master 和 Slave 均返回空诊断码。
- id: agibot_x2.evidence_boundary.joint_state
  subject: joint_state
  status: open
  kind: observability
