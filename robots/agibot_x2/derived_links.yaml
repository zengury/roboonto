# Derived Links — 把隐含在属性里的关系显式化成图边
#
# 这份文件不添加新 object,只添加 link 实例。所有 link 都能从其他 YAML 的
# 属性机械推导出来(e.g. StatusBit.carrier_field="pmu_bool_status" 对应
# 承载它的 pmu_state topic)。Importer 可自动生成,此处先手工列出验证设计。
#
# 原则:**ontology 不允许有未建模的隐含语义**。如果 A 的属性提到 B,
# 那 A ↔ B 之间一定要有显式 link。

links:

# ============================================================
# StatusBit → Topic  (carried_by)
#   PMU 的 11 位由 /aima/hal/pmu/state 承载
#   BMS 的 21 位也由 /aima/hal/pmu/state 承载(pmu_state msg 内)
# ============================================================
- { type: carried_by, source: agibot_x2.event.pmu.rk3588_power_good,          target: agibot_x2.if.topic.pmu_state }
