# ============================================================
# 特殊预设动作:起身姿势(§2.1 开机指南)
# ============================================================
- type: PresetMotion
  id: agibot_x2.motion.lying_stand_up
  properties:
    name_human: 平躺站起
    requires_environment:
      - "正面朝上姿态"
      - "半径 0.5m 范围内无杂物"
      - "无坡度的硬质地面"
    forbidden_contexts:
      - "末端执行器为灵巧手或夹爪时禁用"
    safety_class: HIGH_RISK
  source: { type: document, locator: "aimdk.docx#§2.1.2" }

- type: PresetMotion
  id: agibot_x2.motion.sitting_stand_up
  properties:
    name_human: 坐下站起
    requires_environment:
      - "坐在 35-40cm 带靠背的椅子上"
      - "双脚完全接触地面"
    required_pre_mode: agibot_x2.mode.joint_default
    notes: "切换前需人工扶后把手辅助平衡"
  source: { type: document, locator: "aimdk.docx#§2.1.3" }

# ============================================================
# Links — 模式迁移图
# ============================================================
links:

- type: transitions_to
  source: agibot_x2.mode.passive_default
  target: agibot_x2.mode.joint_default
  properties: { trigger: "遥控 L2+X", requires: "机器人已下降至地面双脚触地" }

- type: transitions_to
  source: agibot_x2.mode.joint_default
  target: agibot_x2.mode.stand_default
  properties: { trigger: "遥控 R2+X", requires: "机器人已下降至地面双脚触地" }

- type: transitions_to
  source: agibot_x2.mode.stand_default
  target: agibot_x2.mode.locomotion_default
  properties: { trigger: "v0.8+ 内部自动切换", auto: true }

- type: transitions_to
  source: agibot_x2.mode.locomotion_default
  target: agibot_x2.mode.stand_default
  properties: { trigger: "速度归零自动回稳", auto: true }

# ============================================================
# Links — 模式允许的动作类型(部分)
# ============================================================
- { type: allows, source: agibot_x2.mode.locomotion_default, target: set_forward_velocity }
- { type: allows, source: agibot_x2.mode.locomotion_default, target: set_lateral_velocity }
- { type: allows, source: agibot_x2.mode.locomotion_default, target: set_angular_velocity }
- { type: allows, source: agibot_x2.mode.stand_default,      target: set_forward_velocity }
- { type: allows, source: agibot_x2.mode.stand_default,      target: set_preset_motion }
- { type: allows, source: agibot_x2.mode.joint_default,      target: set_joint_position }

# ============================================================
# Links — 所有预设动作都要求稳定站立模式
# ============================================================
- { type: forbidden_in, source: set_preset_motion, target: agibot_x2.mode.passive_default }
- { type: forbidden_in, source: set_preset_motion, target: agibot_x2.mode.damping_default }
- { type: forbidden_in, source: set_preset_motion, target: agibot_x2.mode.locomotion_default }

# ============================================================
# Links — 输入源参与 MC 仲裁
# ============================================================
- { type: participates_in, source: agibot_x2.input_source.rc,           target: agibot_x2.control_loop.mc_arbitration }
- { type: participates_in, source: agibot_x2.input_source.vr,           target: agibot_x2.control_loop.mc_arbitration }
- { type: participates_in, source: agibot_x2.input_source.app_proxy,    target: agibot_x2.control_loop.mc_arbitration }
- { type: participates_in, source: agibot_x2.input_source.interaction,  target: agibot_x2.control_loop.mc_arbitration }
- { type: participates_in, source: agibot_x2.input_source.pnc,          target: agibot_x2.control_loop.mc_arbitration }
